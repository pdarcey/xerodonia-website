faq:
  - group: About AI
    items:
      - q: Is AI really ready for use in a real business, or is it still hype?
        a:
          - For specific, well-defined tasks, yes. AI coding agents in particular are mature enough to meaningfully speed up software development when they're implemented properly.
          - The key word is "properly". Most disappointing AI experiences come from tools adopted ad hoc, without proper configuration, training or integration into existing workflows. That's the problem we solve.
      - q: We tried an AI tool before and it didn't work. Why would this be different?
        a:
          - "Most AI tool failures come down to three things: the wrong tool for the job, poor configuration, or a lack of team training."
          - We start by understanding what you tried and why it didn't work. If the approach was fundamentally sound, we'll rehabilitate it. If a different agent would suit you better, we'll recommend that instead.
      - q: What are AI coding agents, exactly?
        a:
          - AI coding agents work alongside your developers, inside the tools they already use (such as VS Code, IntelliJ or Xcode), to help write code faster, catch errors earlier, write documentation and handle repetitive tasks.
          - The most capable today include Claude Code (Anthropic), GitHub Copilot (Microsoft), Codex (OpenAI) and Gemini (Google). Each has different strengths, and the right choice depends on your team's workflow and tech stack.
  - group: Working with us
    items:
      - q: How long does a typical engagement take?
        a:
          - The core implementation in an Initial Setup or Rehabilitation typically takes 2–4 weeks. The month of consultancy included in each service then gives your team time to settle in, ask questions and get extra support.
          - If you have a deadline, tell us during the free audit and we'll design the engagement around it.
      - q: What if we don't have a technical team?
        a:
          - For less technical teams we provide more comprehensive training, simpler tooling choices, and documentation written for non-developers.
          - That said, AI coding agents are primarily tools for developers. If your business doesn't have developers, the free audit is the right place to start. We'll be honest about whether a coding agent makes sense for you, and what else might serve you better.
      - q: Are there ongoing costs after the engagement?
        a:
          - Our services are fixed-price engagements, not subscriptions. Once the engagement is complete, you own everything we've built and configured.
          - You'll pay the AI provider (such as Anthropic, Microsoft, OpenAI or Google) for ongoing use of the agent, which varies by provider and usage. We'll give you a realistic estimate as part of our recommendation. If you'd like more support afterwards, Follow-Up Support is available.
      - q: What happens if the implementation doesn't work as expected?
        a:
          - Every engagement starts with a clear definition of success. The consultancy time included in each service is there to fix issues, answer questions and adjust the setup as your team settles in. We don't disappear once the setup is done.
      - q: Do you work on-site or remotely?
        a:
          - Both. For Sydney businesses we can work on-site for key sessions, such as discovery, training and go-live, and do everything else remotely. For businesses outside Sydney, we deliver everything remotely.
  - group: Pricing
    items:
      - q: Why does this cost $20,000–$30,000? Isn't AI supposed to be cheap?
        a:
          - The AI tool itself is cheap. What costs money is implementing it properly, so it delivers value in your workflows instead of sitting unused after a few weeks.
          - "Our pricing reflects the time it takes to analyse your requirements, configure and test the agent in your environment, train your team in a way that sticks, document everything, and support you for a month while your team gets up to speed."
      - q: What's included in the free AI Opportunity Audit?
        a:
          - "On a video call, we learn about your business, team and current development workflows; identify 2–3 areas where AI coding agents could create genuine value; tell you honestly which agent would suit you best; and recommend a starting point."
          - There's no obligation to go ahead. If we don't think an AI agent will help your business right now, we'll tell you.
      - q: Are your prices in Australian dollars? Do they include GST?
        a:
          - All prices are in Australian dollars (AUD) and exclude GST. GST is added to invoices for Australian clients where applicable.

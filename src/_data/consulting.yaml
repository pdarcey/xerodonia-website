whatWeDo:
  - title: Discovery and strategy
    text: We map your operations to find where AI creates the most value. No guesswork, just a clear, prioritised roadmap based on your actual workflows and goals.
  - title: Agent implementation
    text: We set up coding agents (Claude Code, Copilot, Codex, Gemini) inside your IDE and existing development processes. Best practice, production-ready and fully documented.
  - title: Training and handover
    text: Your team gets hands-on training and comprehensive materials, so they get the most from the agents. No black boxes, no vendor lock-in.
  - title: Ongoing support
    text: AI moves fast. Our consultancy packages keep your setup current, fix issues quickly, and keep your agents delivering as your business grows.
  - title: IDE integration
    text: VS Code, IntelliJ IDEA, PyCharm, WebStorm or Xcode. Whichever tools your developers already use, adoption is seamless from day one.
  - title: On-site or remote
    text: Based in Sydney, we can work on-site with local businesses, or deliver everything remotely for teams anywhere in the world.

whyUs:
  - title: Sydney-based, globally capable
    text: Proudly Australian, with a worldwide remote practice. We understand how Australian businesses work, and we can serve clients anywhere.
  - title: Fixed price, defined outcomes
    text: No open-ended retainers with vague deliverables. Every engagement has a clear scope and a fixed price, so you always know what you're getting and what it costs.
  - title: Best practice, production-ready
    text: Every implementation follows industry best practice, with full documentation and training. No science projects and no technical debt.
  - title: Vendor-agnostic advice
    text: We work with Claude Code, Copilot, Codex and Gemini, and recommend the right tool for your situation. Your success is our only agenda.
  - title: We use what we recommend
    text: Xerodonia builds its own apps with AI coding agents every day. Our advice comes from shipping real software, not from slide decks.


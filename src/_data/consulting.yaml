# AI consulting: one file holds the facts every consulting page uses.
# Ported from the "AI Consulting" Eleventy site (2026-10-05).
# Prices are AUD, excluding GST. Change a price here and every page updates.

audit:
  name: AI Opportunity Audit
  length: 15-minute      # confirmed by Paul 2026-10-05 (the old copy's "45-minute" was wrong)
  summary: "We'll identify 2–3 areas where AI could immediately improve your operations, with no obligation and no jargon."

services:
  - id: initial-setup
    name: Initial Setup
    price: "$20,000"
    unit: AUD excl. GST
    description: Get your first AI coding agent working properly.
    features:
      - Analysis of your business requirements
      - Implement 1 coding agent into your business
      - Hands-on training and training materials
      - Comprehensive documentation
      - A fully working, best-practice implementation
      - 1 month of standard consultancy (80 hours indicative)

  - id: rehabilitate
    name: Rehabilitate Existing Setup
    price: "$30,000"
    unit: AUD excl. GST
    description: For teams with an existing AI agent that isn't delivering results.
    features:
      - Analysis of your business requirements and current setup
      - Re-implement 1 coding agent to best practice
      - Hands-on training and training materials
      - Comprehensive documentation
      - A fully working, best-practice implementation
      - 1 month of intensive consultancy (120 hours indicative)

  - id: follow-up
    name: Follow-Up Support
    price: "$10,000"
    unit: AUD excl. GST
    condition: Only available with Initial Setup or Rehabilitation.
    features:
      - Answers to questions about your setup
      - Fixes for any issues that arise
      - Additional training as required
      - 1 month of routine consultancy (40 hours indicative)

  - id: additional-agent
    name: Additional Coding Agents
    price: "$5,000"
    unit: per agent, AUD excl. GST
    condition: Only available with Initial Setup or Rehabilitation.
    features:
      - Implement 1 additional coding agent
      - Integrated with your existing setup
      - Configured to your team's workflows

fees:
  - { tier: Routine, rate: "$10,000 / month", hours: "40 hours" }
  - { tier: Standard, rate: "$20,000 / month", hours: "80 hours" }
  - { tier: Intensive, rate: "$30,000 / month", hours: "120 hours" }
  - { tier: Ad hoc, rate: "$2,000 / day", hours: "8 hours" }


privacyPolicy:           # the full policy at /apps/secret-santa/privacy/ (App Store Connect "Privacy Policy URL")
  updated: 2026-11-12
  permissions: []        # Secret Santa asks for none
  sections:
    - heading: Your lists
      text: The names you type, and each draw, are saved in the app’s own storage on your device. They aren’t synced to iCloud, and they never leave the device.

support:
  faq:
    - q: How does the draw work?
      a: Secret Santa shuffles everyone into one big circle, and each person buys for the next person around it. That’s why nobody ever draws themselves, and why everyone is part of a single chain.
    - q: Can I keep the draw secret from the person running it?
      a: Not yet. Secret Santa shows the whole draw on one screen, so whoever runs it sees every pair. Pass the device around, or let each person know their recipient privately.
    - q: Can I have more than one list?
      a: "On a Mac, yes: choose File › New Window, and each window keeps its own list. They all come back when you reopen the app."
    - q: How do I remove someone?
      a: "On iPhone and iPad, swipe left on their name. On a Mac, Control-click their name and choose Delete, or press Command-Delete. To start again with an empty list, use the Delete All button (the trash can)."
    - q: How do I report a bug or suggest an idea?
      a: Email us. A real person reads every message.


featuresHeading: Everything a Secret Santa needs
featuresIntro: Names in, draw out.
features:
  - title: One chain through everyone
    text: Nobody draws themselves, and there are no little closed loops, so the presents can be opened one after another, all the way around the group.
  - title: Draw again
    text: Not happy with the draw? Tap Generate Recipients for a new one, as often as you like.
  - title: Change the list any time
    text: Add, rename or remove people whenever you need to, then draw again.
  - title: Remembers your list
    text: Your names and your draw are still there next time you open the app.
  - title: A list in every window on the Mac
    text: Run the office, family and friends draws side by side. Each window keeps its own list, and they all come back when you reopen the app.
  - title: iPhone, iPad and Mac
    text: The same simple app on every device you use.

privacy:                 # the "Private by design" panel on the app page
  quote: Your list is nobody’s business but yours.
  summary: Secret Santa keeps your lists on your device. It asks for no permissions, has no analytics and no servers, and it doesn’t make network requests.

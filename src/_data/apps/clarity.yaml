tagline: The issue tracker we built for ourselves, with a Mac app, a CLI and an MCP server for AI agents.
headline: Project and issue tracking for indie Mac developers.
summary: "Clarity tracks projects, issues and releases in a native Mac app. It also works from the command line, and as an MCP server so AI coding agents can read and update issues as they work."
